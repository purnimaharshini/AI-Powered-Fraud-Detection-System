spring.application.name=online-transaction-fraud-detection
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ai_banking_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Root@123}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=1000
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.default-property-inclusion=non_null
server.servlet.session.cookie.http-only=true
server.servlet.session.timeout=30m

app.bootstrap.enabled=${APP_BOOTSTRAP_ENABLED:true}
app.bootstrap.csv-path=${APP_BOOTSTRAP_CSV_PATH:classpath:data/bank_transactions.csv}
app.resend.enabled=${APP_RESEND_ENABLED:true}
app.resend.api-key=${APP_RESEND_API_KEY:}
app.resend.api-key-path=${APP_RESEND_API_KEY_PATH:access_token.txt}
app.resend.from-email=${APP_RESEND_FROM_EMAIL:onboarding@resend.dev}
app.resend.from-name=${APP_RESEND_FROM_NAME:Fraud Detection Alerts}
